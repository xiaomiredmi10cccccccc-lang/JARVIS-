name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            gettext \
            autopoint

      - name: Check environment
        run: |
          set -e

          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo "=============================="
          echo "PYTHON"
          echo "=============================="
          python --version

          echo "=============================="
          echo "PIP"
          echo "=============================="
          python -m pip --version

          echo "=============================="
          echo "ANDROID_HOME"
          echo "=============================="
          echo "$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          echo "=============================="
          echo "SDKMANAGER"
          echo "=============================="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          echo "Installing Android SDK packages..."

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          set -e

          echo "=============================="
          echo "ANDROID PLATFORMS"
          echo "=============================="

          ls -lah "$ANDROID_HOME/platforms"

          echo "=============================="
          echo "ANDROID BUILD TOOLS"
          echo "=============================="

          ls -lah "$ANDROID_HOME/build-tools"

          echo "Checking android-33..."

          test -d "$ANDROID_HOME/platforms/android-33"

          echo "Checking build-tools 35.0.0..."

          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK check: OK"

      - name: Configure Buildozer SDK
        run: |
          set -e

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK directory:"
          echo "$SDK_DIR"

          mkdir -p "$SDK_DIR/tools/bin"

          ln -sfn \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"

          ln -sfn \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$SDK_DIR/tools/bin/avdmanager"

          ln -sfn \
            "$ANDROID_HOME/platform-tools" \
            "$SDK_DIR/platform-tools"

          ln -sfn \
            "$ANDROID_HOME/platforms" \
            "$SDK_DIR/platforms"

          ln -sfn \
            "$ANDROID_HOME/build-tools" \
            "$SDK_DIR/build-tools"

          echo "Buildozer SDK links:"
          find "$SDK_DIR" -maxdepth 3 -type l -ls || true

          echo "Configuring buildozer.spec..."

          if grep -q '^android.sdk_path' buildozer.spec; then
            sed -i \
              "s|^android.sdk_path.*|android.sdk_path = $ANDROID_HOME|" \
              buildozer.spec
          else
            printf '\nandroid.sdk_path = %s\n' "$ANDROID_HOME" >> buildozer.spec
          fi

          if grep -q '^android.accept_sdk_license' buildozer.spec; then
            sed -i \
              's|^android.accept_sdk_license.*|android.accept_sdk_license = True|' \
              buildozer.spec
          else
            printf 'android.accept_sdk_license = True\n' >> buildozer.spec
          fi

          if grep -q '^android.skip_update' buildozer.spec; then
            sed -i \
              's|^android.skip_update.*|android.skip_update = True|' \
              buildozer.spec
          else
            printf 'android.skip_update = True\n' >> buildozer.spec
          fi

          echo "=============================="
          echo "BUILDOSER ANDROID SETTINGS"
          echo "=============================="

          grep -E \
            '^(android.sdk_path|android.accept_sdk_license|android.skip_update)' \
            buildozer.spec || true

      - name: Install Buildozer
        run: |
          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

          echo "=============================="
          echo "BUILDOZER VERSION"
          echo "=============================="

          buildozer --version

          echo "=============================="
          echo "CYTHON VERSION"
          echo "=============================="

          cython --version

      - name: Build APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          rm -f build.log

          echo "======================================"
          echo "          JARVIS ANDROID BUILD"
          echo "======================================"

          echo "Starting Buildozer..."

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "Buildozer exit code: ${BUILD_STATUS}"
          echo "======================================"

          echo "exit_code=${BUILD_STATUS}" >> "$GITHUB_OUTPUT"

          exit "${BUILD_STATUS}"

      - name: Show build error
        if: steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "         JARVIS BUILD FAILED"
          echo "======================================"

          echo ""
          echo "========= LAST 200 LINES ========="

          tail -n 200 build.log || true

          echo ""
          echo "======= IMPORTANT ERROR LINES ======="

          grep -Ein \
            'error:|error |failed|failure|exception|traceback|returned non-zero|exit code|no such file|not found|command failed|sh\.ErrorReturnCode' \
            build.log | tail -n 100 || true

      - name: Check APK
        if: steps.build_apk.outcome == 'success'
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "           CHECKING APK"
          echo "======================================"

          ls -lah bin || true

          APK_FILE="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file was not created."
            exit 1
          fi

          echo ""
          echo "APK CREATED:"
          echo "$APK_FILE"

          ls -lh "$APK_FILE"

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Final status
        if: steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       JARVIS APK BUILD FAILED"
          echo "======================================"

          echo ""
          echo "The full build log was uploaded."
          echo "Artifact name: JARVIS-build-log"

          exit 1
