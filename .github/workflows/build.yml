name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

      - name: Install Android SDK tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          ln -sfn "$ANDROID_HOME/platform-tools" ~/.buildozer/android/platform/android-sdk/platform-tools
          ln -sfn "$ANDROID_HOME/platforms" ~/.buildozer/android/platform/android-sdk/platforms
          ln -sfn "$ANDROID_HOME/build-tools" ~/.buildozer/android/platform/android-sdk/build-tools
          ln -sfn "$ANDROID_HOME/cmdline-tools" ~/.buildozer/android/platform/android-sdk/cmdline-tools

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.37

      - name: Build APK
        run: |
          buildozer android clean
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
