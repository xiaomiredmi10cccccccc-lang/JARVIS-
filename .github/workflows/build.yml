name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java 17 and dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake gettext autopoint

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          java -version
          javac -version

      - name: Install Android SDK packages
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"

      - name: Verify environment
        run: |
          set -e
          python --version
          python -m pip --version
          java -version
          javac -version
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Configure Buildozer
        run: |
          set -e

          if grep -q '^android.sdk_path' buildozer.spec; then
            sed -i "s|^android.sdk_path.*|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          else
            printf '\nandroid.sdk_path = %s\n' "$ANDROID_HOME" >> buildozer.spec
          fi

          if grep -q '^android.accept_sdk_license' buildozer.spec; then
            sed -i 's|^android.accept_sdk_license.*|android.accept_sdk_license = True|' buildozer.spec
          else
            printf 'android.accept_sdk_license = True\n' >> buildozer.spec
          fi

          if grep -q '^android.skip_update' buildozer.spec; then
            sed -i 's|^android.skip_update.*|android.skip_update = True|' buildozer.spec
          else
            printf 'android.skip_update = True\n' >> buildozer.spec
          fi

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Install Buildozer
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0 cython==0.29.37
          buildozer --version
          cython --version

      - name: Build APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -f build.log

          buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Show build error
        if: steps.build_apk.outcome == 'failure'
        run: |
          tail -n 200 build.log || true
          grep -Ein \
            'error:|failed|failure|exception|traceback|command failed|not a supported wheel' \
            build.log | tail -n 100 || true

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Final status
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "JARVIS APK BUILD FAILED"
          echo "Download the JARVIS-build-log artifact to inspect the error."
          exit 1
